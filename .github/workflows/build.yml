name: Build via Xbox One XDK (teste)

on:
  workflow_dispatch:
    inputs:
      xdk_url:
        description: "URL direta do zip do Xbox One XDK"
        required: true
      contribs_url:
        description: "URL direta do Contribs.zip (opcional se houver pasta Contribs no repo)"
        required: false
        default: ""
      xdk_install_args:
        description: "Argumentos do XboxOneXDK.exe"
        required: false
        default: "/quiet /norestart /log D:\\xdk_install.log"
      configuration:
        description: "Configuration"
        required: false
        default: "Release"
      platform:
        description: "Platform"
        required: false
        default: "Durango"
      toolset:
        description: "PlatformToolset (v141, v140, v120 ou v110)"
        required: false
        default: "v141"
      project:
        description: "Projeto a compilar (vazio = solution inteira)"
        required: false
        default: "XboxClient\\XboxClient.vcxproj"

jobs:
  build-xdk:
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      XDK_URL: ${{ inputs.xdk_url }}
      CONTRIBS_URL: ${{ inputs.contribs_url }}
      XDK_ARGS: ${{ inputs.xdk_install_args }}
      BUILD_CFG: ${{ inputs.configuration }}
      BUILD_PLAT: ${{ inputs.platform }}
      XDK_TOOLSET: ${{ inputs.toolset }}
      XDK_PROJECT: ${{ inputs.project }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- 1) Baixar e extrair o XDK ----------
      - name: Download & extract Xbox One XDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\xdk_dl","D:\xdk" | Out-Null
          Write-Host "Baixando XDK..."
          curl.exe -L --fail --retry 3 -o "D:\xdk_dl\xdk.zip" "$env:XDK_URL"
          if ($LASTEXITCODE -ne 0) { Write-Error "Falha ao baixar o XDK (link invalido/expirado?)"; exit 1 }
          Write-Host "Extraindo..."
          7z x "D:\xdk_dl\xdk.zip" "-oD:\xdk" -y | Select-Object -Last 5
          Remove-Item -Force "D:\xdk_dl\xdk.zip"
          Get-ChildItem "D:\xdk" -Recurse -Depth 2 | Select-Object -First 80 FullName | Format-Table -HideTableHeaders

      # ---------- 2) VS 2017 Build Tools ----------
      - name: Install VS 2017 Build Tools
        continue-on-error: true
        shell: pwsh
        run: |
          curl.exe -L --fail -o "$env:RUNNER_TEMP\vs2017bt.exe" "https://aka.ms/vs/15/release/vs_buildtools.exe"
          $p = Start-Process "$env:RUNNER_TEMP\vs2017bt.exe" -Wait -PassThru -ArgumentList @(
            "--quiet","--wait","--norestart","--nocache",
            "--installPath","C:\BuildTools2017",
            "--add","Microsoft.VisualStudio.Workload.VCTools",
            "--includeRecommended"
          )
          Write-Host "VS2017 Build Tools saiu com codigo $($p.ExitCode)"
          if (Test-Path "C:\BuildTools2017\MSBuild\15.0\Bin\MSBuild.exe") { Write-Host "MSBuild 2017 OK" } else { Write-Host "::warning::VS2017 Build Tools nao instalou" }

      # ---------- 3) Instalar o XDK (com monitoramento) ----------
      - name: Install Xbox One XDK
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem "D:\xdk" -Recurse -Filter *.msi | Where-Object { $_.FullName -match "Redistributable" } | ForEach-Object {
            Write-Host "msiexec: $($_.FullName)"
            $m = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/i","`"$($_.FullName)`"","/qn","/norestart")
            Write-Host "  codigo $($m.ExitCode)"
          }

          $exe = Get-ChildItem "D:\xdk" -Recurse -Filter "XboxOneXDK.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Rodando: $($exe.FullName) $env:XDK_ARGS"
            $p = Start-Process $exe.FullName -ArgumentList $env:XDK_ARGS -PassThru
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $limit = 40 * 60
            while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $limit) {
              Start-Sleep -Seconds 60
              Write-Host "---- $([int]$sw.Elapsed.TotalMinutes) min ----"
              Get-Process | Where-Object { $_.Name -match "msiexec|XboxOne|XDK|setup|dotnet|vs_|Windows6|wusa|dism" } |
                Select-Object -First 8 Name, Id, @{n="CPU(s)";e={[int]$_.CPU}} | Format-Table -HideTableHeaders | Out-String | Write-Host
              if (Test-Path "D:\xdk_install.log") { Write-Host "[xdk_install.log]"; Get-Content "D:\xdk_install.log" -Tail 4 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $_" } }
            }
            if (-not $p.HasExited) { Write-Host "::warning::Instalador passou de 40 min, encerrando"; Stop-Process -Id $p.Id -Force }
            else { Write-Host "XboxOneXDK.exe saiu com codigo $($p.ExitCode)" }
          } else {
            $cmd = Get-ChildItem "D:\xdk" -Recurse -Filter "InstallXboxOneDKs.cmd" | Select-Object -First 1
            if ($cmd) {
              Write-Host "Rodando $($cmd.FullName)"
              Push-Location (Split-Path $cmd.FullName)
              cmd.exe /c "`"$($cmd.FullName)`""
              Pop-Location
            } else { Write-Host "::warning::Nenhum instalador do XDK encontrado" }
          }

      - name: Detect XDK
        shell: pwsh
        run: |
          $xdk = [Environment]::GetEnvironmentVariable("DurangoXDK","Machine")
          if (-not $xdk) {
            $cand = Get-ChildItem "${env:ProgramFiles(x86)}","C:\Program Files","D:\" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "Durango|Xbox.*XDK" } | Select-Object -First 1
            if ($cand) {
              $sub = Get-ChildItem $cand.FullName -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
              $xdk = if ($sub) { $sub.FullName } else { $cand.FullName }
            }
          }
          if ($xdk) {
            if (-not $xdk.EndsWith("\")) { $xdk += "\" }
            Write-Host "DurangoXDK=$xdk"
            "DurangoXDK=$xdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "::warning::XDK nao detectado apos a instalacao (veja os logs)"
          }
          Get-ChildItem "C:\BuildTools2017\MSBuild" -Recurse -Directory -Filter "Durango" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName

      # ---------- 4) CONTRIB_PATH ----------
      - name: Prepare Contribs (CONTRIB_PATH)
        shell: pwsh
        run: |
          $ws = (Get-Location).Path
          $contrib = $null
          $local = Get-ChildItem -Path $ws -Directory -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ieq "contribs" } | Select-Object -First 1
          if ($local) { $contrib = $local.FullName }

          if (-not $contrib -and $env:CONTRIBS_URL) {
            New-Item -ItemType Directory -Force -Path "D:\contribs_ext" | Out-Null
            curl.exe -L --fail --retry 3 -o "D:\contribs.zip" "$env:CONTRIBS_URL"
            if ($LASTEXITCODE -ne 0) { Write-Error "Falha ao baixar Contribs.zip"; exit 1 }
            7z x "D:\contribs.zip" "-oD:\contribs_ext" -y | Select-Object -Last 3
            Remove-Item -Force "D:\contribs.zip"
            $contrib = "D:\contribs_ext"
            $inner = Get-ChildItem $contrib -Directory | Where-Object { $_.Name -ieq "contribs" } | Select-Object -First 1
            if ($inner) { $contrib = $inner.FullName }
          }

          if (-not $contrib) {
            Write-Host "Sem Contribs: usando so Boost 1.56.0"
            New-Item -ItemType Directory -Force -Path "$ws\third_party\boost" | Out-Null
            curl.exe -sL --fail "https://archives.boost.io/release/1.56.0/source/boost_1_56_0.tar.bz2" -o "boost.tar.bz2"
            tar.exe -xjf "boost.tar.bz2" -C "third_party/boost" --strip-components=1 "boost_1_56_0/boost"
            Remove-Item -Force "boost.tar.bz2"
            $contrib = "$ws\third_party"
          }

          $ver = Get-ChildItem -Path $contrib -Filter "version.hpp" -Recurse -Depth 6 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\boost\\version\.hpp$' } | Select-Object -First 1
          if (-not $ver) { Write-Error "boost\version.hpp nao encontrado em $contrib"; exit 1 }
          $boostRoot = Split-Path (Split-Path $ver.FullName)
          Write-Host "CONTRIB_PATH=$contrib | BOOST_ROOT=$boostRoot"
          "CONTRIB_PATH=$contrib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BOOST_ROOT=$boostRoot"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---------- 5) Build ----------
      - name: Build (Durango)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "logs" | Out-Null
          $repo = (Get-Location).Path

          # ----- diagnostico do XDK -----
          Write-Host "===== DurangoXDK = $env:DurangoXDK ====="
          if ($env:DurangoXDK -and (Test-Path $env:DurangoXDK)) {
            Get-ChildItem $env:DurangoXDK -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 60 -ExpandProperty FullName
          } else { Write-Host "Pasta do XDK nao existe!" }

          Write-Host "===== Integracoes Durango no MSBuild ====="
          Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild","C:\BuildTools2017\Common7\IDE\VC\VCTargets","C:\BuildTools2017\MSBuild" -Recurse -Directory -Filter "Durango" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host $_.FullName
              Get-ChildItem (Join-Path $_.FullName "PlatformToolsets") -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    toolset: $($_.Name)" }
            }

          $props = "${env:ProgramFiles(x86)}\MSBuild\Microsoft.Cpp\v4.0\V110\Platforms\Durango\Microsoft.Cpp.Durango.default.props"
          if (Test-Path $props) {
            Write-Host "===== $props (linhas 10-35) ====="
            Get-Content $props | Select-Object -Skip 9 -First 26 | ForEach-Object { Write-Host $_ }
          }
          Write-Host "===== Variaveis XDK ====="
          Get-ChildItem env: | Where-Object { $_.Name -match "Durango|XDK|Xbox" } | ForEach-Object { Write-Host "$($_.Name)=$($_.Value)" }
          Write-Host "====================================="

          # ----- build -----
          $root = $repo
          $nested = Get-ChildItem -Path $repo -Directory | Where-Object { Test-Path (Join-Path $_.FullName "App") } | Select-Object -First 1
          if (-not (Test-Path (Join-Path $repo "App")) -and $nested) { $root = $nested.FullName }

          $msb = "C:\BuildTools2017\MSBuild\15.0\Bin\MSBuild.exe"
          if (-not (Test-Path $msb)) {
            Write-Host "::warning::Usando MSBuild do VS 2022 (Durango provavelmente nao vai existir)"
            $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msb = & $vsw -latest -products * -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          }
          Write-Host "MSBuild: $msb"

          $extraInc = @($env:BOOST_ROOT, $env:CONTRIB_PATH, $root, "$root\App\include", "$root\ClientShared", "$root\Log\include", "$root\Rendering\G3D\include", "$root\Network\include") |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $env:INCLUDE = (($extraInc -join ";") + ";" + $env:INCLUDE)
          $env:CL  = (($extraInc | ForEach-Object { "/I`"$_`"" }) -join " ") + " /D_WINSOCK_DEPRECATED_NO_WARNINGS /D_CRT_SECURE_NO_WARNINGS /D_SCL_SECURE_NO_WARNINGS /FS"
          $env:_CL_ = "/WX- /w /Zc:strictStrings-"

          $target = $null
          if ($env:XDK_PROJECT) {
            $cand = Join-Path $root $env:XDK_PROJECT
            if (Test-Path $cand) { $target = $cand } else { Write-Host "Projeto '$env:XDK_PROJECT' nao encontrado, usando a solution." }
          }
          if (-not $target) {
            $allSlns = Get-ChildItem -Path $root -Filter "*.sln" -Recurse -Depth 5
            $sln = $allSlns | Where-Object { $_.Name -notmatch "CSharp" -and $_.Name -match "Client" } | Select-Object -First 1
            if (-not $sln) { $sln = $allSlns | Select-Object -First 1 }
            if (-not $sln) { Write-Error "Nenhum .sln encontrado"; exit 1 }
            $target = $sln.FullName
            $slnContent = Get-Content -Path $target -Raw
            $configs = [regex]::Matches($slnContent, '^\s*([^|=\r\n\s][^|=\r\n]*)\|([^=\r\n]+)\s*=', 'Multiline') |
              ForEach-Object { "$($_.Groups[1].Value.Trim())|$($_.Groups[2].Value.Trim())" } | Select-Object -Unique
            Write-Host "Configuracoes da solution:"; $configs | ForEach-Object { Write-Host "  $_" }
          }
          Write-Host "Alvo: $target | Toolset: $env:XDK_TOOLSET | $env:BUILD_CFG|$env:BUILD_PLAT"

          & $msb $target `
            "/p:Configuration=$env:BUILD_CFG" "/p:Platform=$env:BUILD_PLAT" `
            "/p:PlatformToolset=$env:XDK_TOOLSET" `
            "/p:VisualStudioVersion=15.0" `
            "/p:CONTRIB_PATH=$env:CONTRIB_PATH" `
            "/p:DurangoXDK=$env:DurangoXDK" `
            "/p:TreatWarningAsError=false" `
            /maxCpuCount:1 /nologo /v:minimal `
            "/flp:LogFile=$repo\logs\build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { Write-Host "BUILD FALHOU ($LASTEXITCODE)"; exit 1 }

      # ---------- 6) Artefatos ----------
      - name: Collect install logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "logs" | Out-Null
          if (Test-Path "D:\xdk_install.log") { Copy-Item "D:\xdk_install.log" "logs\" }
          Get-ChildItem $env:TEMP -Filter "*.log" -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -gt (Get-Date).AddHours(-6) -and $_.Length -lt 50MB } |
            Select-Object -First 30 | ForEach-Object { Copy-Item $_.FullName "logs\" -ErrorAction SilentlyContinue }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdk-build-logs
          path: logs/**
          if-no-files-found: ignore

      - name: Upload built binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xdk-build-release
          path: |
            **/*.exe
            **/*.dll
            !**/third_party/**
          if-no-files-found: warn
