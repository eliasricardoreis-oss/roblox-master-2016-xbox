name: Auto Build Windows & Web Gambiarra + Release

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: "Configuração (Release ou Debug)"
        required: true
        default: "Release"
      platform:
        description: "Plataforma Windows da solution (x64, x86 ou ARM)"
        required: true
        default: "x64"
      release_tag:
        description: "Tag da GitHub Release"
        required: true
        default: "latest-build"
      contribs_direct_url:
        description: "Opcional: URL direta do Contribs.zip se o MediaFire bloquear"
        required: false
        default: ""

permissions:
  contents: write

env:
  BUILD_CONFIG: ${{ github.event.inputs.build_configuration || 'Release' }}
  WIN_PLATFORM: ${{ github.event.inputs.platform || 'x64' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'latest-build' }}
  MEDIAFIRE_PAGE_URL: "https://www.mediafire.com/file/2srfgcurru99dfu/Contribs.zip/file?action=check"
  CONTRIBS_DIRECT_URL: ${{ github.event.inputs.contribs_direct_url || '' }}

jobs:
  build-windows-uwp:
    name: Windows - XboxUWPClient
    runs-on: windows-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente MSVC (VsDevCmd.bat)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe não encontrado."
            exit 1
          }
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            Write-Error "Instalação do Visual Studio com MSBuild não encontrada."
            exit 1
          }
          $devCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) {
            Write-Error "VsDevCmd.bat não encontrado em $devCmd"
            exit 1
          }

          "VS_INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $arch = if ($env:WIN_PLATFORM -eq "x64") { "amd64" } elseif ($env:WIN_PLATFORM -eq "ARM") { "arm" } else { "x86" }
          $envLines = cmd /s /c "`"$devCmd`" -arch=$arch -host_arch=amd64 && set"
          foreach ($line in $envLines) {
            if ($line -match "^([^=]+)=(.*)$") {
              $name = $matches[1]
              $val = $matches[2]
              if ($name -ne "PATH") {
                "$name=$val" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              } else {
                "$val" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              }
            }
          }

      - name: Baixar e extrair Contribs.zip na nuvem (com retomada e retry)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "third_party" -Force | Out-Null
          $zipFile = "Contribs.zip"
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          $downloadUrl = $env:CONTRIBS_DIRECT_URL
          if ([string]::IsNullOrWhiteSpace($downloadUrl)) {
            Write-Host "Consultando página do MediaFire..."
            $htmlFile = "mediafire_page.html"
            curl.exe -L --fail --silent --show-error --retry 5 --retry-delay 3 -A $ua $env:MEDIAFIRE_PAGE_URL -o $htmlFile
            $html = Get-Content -Path $htmlFile -Raw -ErrorAction SilentlyContinue
            Remove-Item $htmlFile -Force -ErrorAction SilentlyContinue

            $match = [regex]::Match($html, 'https?://download[0-9]+\.mediafire\.com/[^"''\s<>]+Contribs\.zip[^"''\s<>]*')
            if (-not $match.Success) {
              $match = [regex]::Match($html, 'https?://[^"''\s<>]*mediafire\.com/[^"''\s<>]*Contribs\.zip[^"''\s<>]*')
            }

            if ($match.Success) {
              $downloadUrl = [System.Net.WebUtility]::HtmlDecode($match.Value)
              Write-Host "Link direto do MediaFire encontrado."
            } else {
              Write-Error "Não foi possível extrair o link direto do MediaFire. Se falhar, informe contribs_direct_url no workflow_dispatch."
              exit 1
            }
          }

          Write-Host "Baixando Contribs.zip no runner..."
          $maxAttempts = 10
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "Tentativa $attempt de $maxAttempts..."
            curl.exe -L -C - --fail --show-error --retry 5 --retry-delay 5 --retry-connrefused `
              -A $ua -H "Referer: https://www.mediafire.com/" $downloadUrl -o $zipFile

            if ($LASTEXITCODE -eq 0 -and (Test-Path $zipFile)) {
              $bytes = Get-Content -Path $zipFile -AsByteStream -TotalCount 4
              $header = [System.Text.Encoding]::ASCII.GetString($bytes)
              if (-not $header.StartsWith("PK")) {
                Remove-Item $zipFile -Force -ErrorAction SilentlyContinue
                Write-Error "O arquivo baixado não é um ZIP válido (cabeçalho '$header')."
                exit 1
              }

              $sizeMB = [math]::Round(((Get-Item $zipFile).Length / 1MB), 1)
              Write-Host "Download concluído ($sizeMB MB). Testando integridade com 7z..."
              7z t $zipFile -y | Out-Null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "ZIP íntegro!"
                break
              } else {
                Write-Warning "ZIP incompleto ou corrompido (exit code $LASTEXITCODE). Tentando retomar..."
                if ($attempt -ge 5) {
                  Remove-Item $zipFile -Force -ErrorAction SilentlyContinue
                }
              }
            } else {
              Write-Warning "Falha no curl (exit code $LASTEXITCODE). Aguardando retentativa..."
              Start-Sleep -Seconds 5
            }

            if ($attempt -eq $maxAttempts) {
              Write-Error "Não foi possível baixar um Contribs.zip íntegro após $maxAttempts tentativas."
              exit 1
            }
          }

          Write-Host "Extraindo com 7z..."
          7z x $zipFile -o"third_party" -mmt=on -y
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha durante a extração com 7z (exit code $LASTEXITCODE)."
            exit 1
          }

          Remove-Item $zipFile -Force -ErrorAction SilentlyContinue
          Write-Host "Contribs extraído e arquivo .zip deletado do disco."

      - name: Compilar Boost (b2.exe) apenas se stage\lib não existir
        shell: pwsh
        run: |
          $boostDir = Get-ChildItem -Path "third_party" -Filter "boost_1_56_0" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($boostDir) {
            $stageLib = Join-Path $boostDir.FullName "stage\lib"
            $b2 = Get-ChildItem -Path $boostDir.FullName -Filter "b2.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ((Test-Path $stageLib) -and ((Get-ChildItem $stageLib -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)) {
              Write-Host "stage\lib já existe em $($boostDir.FullName); pulando recompilação do Boost."
            } elseif ($b2) {
              Push-Location $b2.DirectoryName
              $cfg = $env:BUILD_CONFIG.ToLower()

              [int]$cpus = 2
              if ($env:NUMBER_OF_PROCESSORS -and [int]::TryParse($env:NUMBER_OF_PROCESSORS, [ref]$cpus)) {
                if ($cpus -lt 1) { $cpus = 1 }
                if ($cpus -gt 256) { $cpus = 256 }
              }
              Write-Host "Executando b2.exe com -j $cpus"
              .\b2.exe --build-type=minimal link=static runtime-link=shared variant=$cfg -j $cpus
              Pop-Location
            }
          }

      - name: Detectar Toolset disponível e atualizar arquivos .vcxproj
        shell: pwsh
        run: |
          $targetSdk = "10.0.26100.0"
          $platformTargetsRoot = Join-Path $env:VS_INSTALL_PATH "MSBuild\Microsoft\VC\v180\Platforms"
          $installedToolsets = @()

          if (Test-Path $platformTargetsRoot) {
            $toolsetProps = Get-ChildItem -Path $platformTargetsRoot -Filter "Toolset.props" -Recurse -ErrorAction SilentlyContinue
            foreach ($p in $toolsetProps) {
              $tsName = Split-Path -Leaf (Split-Path -Parent $p.FullName)
              if ($tsName -and ($installedToolsets -notcontains $tsName)) {
                $installedToolsets += $tsName
              }
            }
          }

          Write-Host "Toolsets detectados em Platforms: $($installedToolsets -join ', ')"

          $targetToolset = "v145"
          if ($installedToolsets -contains "v145") {
            $targetToolset = "v145"
          } elseif ($installedToolsets -contains "v143") {
            $targetToolset = "v143"
          } elseif ($installedToolsets.Count -gt 0) {
            $targetToolset = ($installedToolsets | Sort-Object -Descending | Select-Object -First 1)
          }

          Write-Host "Usando PlatformToolset alvo: $targetToolset e Windows SDK: $targetSdk"
          "RESOLVED_TOOLSET=$targetToolset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem -Path . -Filter "*.vcxproj" -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $changed = $false

            if ($content -match "10\.0\.14393\.0") {
              Write-Host "Substituindo SDK 10.0.14393.0 em: $($_.Name)"
              $content = $content -replace "10\.0\.14393\.0", $targetSdk
              $changed = $true
            }

            if ($content -match "(<PlatformToolset[^>]*>)v140(</PlatformToolset>)") {
              Write-Host "Substituindo PlatformToolset v140 -> $targetToolset em: $($_.Name)"
              $content = [regex]::Replace($content, "(<PlatformToolset[^>]*>)v140(</PlatformToolset>)", "`${1}$targetToolset`${2}")
              $changed = $true
            }

            if ($changed) {
              Set-Content -Path $_.FullName -Value $content -NoNewline
            }
          }

      - name: Compilar XboxUWPClient.sln
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter "XboxUWPClient.sln" -Recurse | Select-Object -First 1
          if (-not $sln) {
            Write-Error "XboxUWPClient.sln não encontrado."
            exit 1
          }
          $toolset = if ($env:RESOLVED_TOOLSET) { $env:RESOLVED_TOOLSET } else { "v145" }
          Write-Host "Compilando $($sln.FullName) [$($env:BUILD_CONFIG)|$($env:WIN_PLATFORM)] com SDK 10.0.26100.0 e Toolset $toolset"
          msbuild $sln.FullName `
            /p:Configuration=$env:BUILD_CONFIG `
            /p:Platform=$env:WIN_PLATFORM `
            /p:PlatformToolset=$toolset `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:WindowsTargetPlatformMinVersion=10.0.10240.0 `
            /m `
            /p:AppxBundle=Never

      - name: Empacotar artefato Windows (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release_assets" -Force | Out-Null
          $winOut = "release_assets\windows-uwp-${env:WIN_PLATFORM}-${env:BUILD_CONFIG}.zip"
          $files = Get-ChildItem -Path . -Include *.exe,*.dll,*.lib,*.appx,*.appxbundle,*.msix,*.msixbundle -Recurse |
            Where-Object { $_.FullName -notlike "*\third_party\*" -and $_.FullName -notlike "*\release_assets\*" }
          if ($files.Count -gt 0) {
            Compress-Archive -Path $files.FullName -DestinationPath $winOut -Force
          } else {
            "Nenhum binário gerado pelo MSBuild." | Out-File "release_assets\windows-build-info.txt"
          }

      - name: Upload artefato Windows (para o job de Release)
        uses: actions/upload-artifact@v4
        with:
          name: win-release-assets
          path: release_assets/

  build-web-gambiarra:
    name: Web - Gambiarra (WASM Bridge + HTML5)
    runs-on: ubuntu-latest
    needs: build-windows-uwp

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Baixar artefato Windows empacotado
        uses: actions/download-artifact@v4
        with:
          name: win-release-assets
          path: win_assets

      - name: Instalar Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"

      - name: Gerar módulo WASM + runner HTML5 (gambiarra) e empacotar .zip
        shell: bash
        run: |
          mkdir -p web_out release_assets

          cat << 'EOF' > web_out/gambiarra_bridge.cpp
          #include <emscripten/emscripten.h>

          extern "C" {
            EMSCRIPTEN_KEEPALIVE
            const char* get_client_info() {
              return "XboxUWPClient Web Gambiarra Bridge (WASM)";
            }

            EMSCRIPTEN_KEEPALIVE
            int ping_bridge(int v) {
              return v + 1;
            }
          }
          EOF

          emcc web_out/gambiarra_bridge.cpp \
            -O2 \
            -s WASM=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o web_out/gambiarra_bridge.js

          cat << 'EOF' > web_out/index.html
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <title>XboxUWPClient - Web Gambiarra</title>
            <style>
              body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
              canvas { display: block; width: 100%; max-width: 960px; height: 540px; background: #1d1f27; border: 1px solid #333; margin-top: 12px; }
              .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
              input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
              button { cursor: pointer; background: #2b6cb0; border-color: #2b6cb0; }
            </style>
          </head>
          <body>
            <h2>XboxUWPClient — Web Gambiarra Runner</h2>
            <div class="bar">
              <input id="wsUrl" type="text" value="ws://localhost:8080" size="28" />
              <button id="btnConnect">Conectar Stream/Bridge</button>
              <button id="btnPing">Testar WASM</button>
              <span id="status">Aguardando...</span>
            </div>
            <canvas id="screen" width="1280" height="720"></canvas>

            <script src="gambiarra_bridge.js"></script>
            <script>
              const statusEl = document.getElementById("status");
              const canvas = document.getElementById("screen");
              const ctx = canvas.getContext("2d");
              let ws = null;

              function drawPlaceholder(msg) {
                ctx.fillStyle = "#1d1f27";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#9ca3af";
                ctx.font = "20px sans-serif";
                ctx.fillText(msg, 32, 64);
              }

              drawPlaceholder("WASM carregado. Conecte a um host/bridge ou use como frontend web.");

              Module.onRuntimeInitialized = () => {
                const info = Module.ccall("get_client_info", "string", [], []);
                statusEl.textContent = info;
              };

              document.getElementById("btnPing").onclick = () => {
                const res = Module.ccall("ping_bridge", "number", ["number"], [41]);
                statusEl.textContent = "WASM ping -> " + res;
              };

              document.getElementById("btnConnect").onclick = () => {
                const url = document.getElementById("wsUrl").value.trim();
                if (ws) ws.close();
                ws = new WebSocket(url);
                ws.binaryType = "arraybuffer";
                ws.onopen = () => statusEl.textContent = "Conectado em " + url;
                ws.onclose = () => statusEl.textContent = "Desconectado";
                ws.onerror = () => statusEl.textContent = "Erro de conexão WS";
                ws.onmessage = async (ev) => {
                  if (ev.data instanceof ArrayBuffer) {
                    const blob = new Blob([ev.data], { type: "image/jpeg" });
                    const bmp = await createImageBitmap(blob);
                    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
                  }
                };
              };
            </script>
          </body>
          </html>
          EOF

          rm -f web_out/gambiarra_bridge.cpp
          zip -r "release_assets/web-gambiarra-${BUILD_CONFIG}.zip" web_out/
          cp win_assets/* release_assets/ 2>/dev/null || true

      - name: Publicar tudo no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: "Build ${{ env.RELEASE_TAG }} (${{ env.BUILD_CONFIG }})"
          draft: false
          prerelease: false
          files: release_assets/*
