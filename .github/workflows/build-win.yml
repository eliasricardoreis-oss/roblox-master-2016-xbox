name: XboxWinClient (port Xbox -> Windows, experimental)

on:
  workflow_dispatch:
    inputs:
      contribs_repo:
        description: "Repo git com a pasta Contribs"
        required: false
        default: "https://github.com/SANS3R66/roblox-2016-source-code.git"
      contribs_subdir:
        description: "Subpasta do Contribs dentro do repo"
        required: false
        default: "Contribs"
      contribs_ref:
        description: "Branch/tag (vazio = branch padrao)"
        required: false
        default: ""
      project_file:
        description: "Nome do .vcxproj a compilar"
        required: false
        default: "XboxClient.vcxproj"
      toolset:
        description: "PlatformToolset (auto = v140 se instalar, senao v143)"
        required: false
        default: "auto"
      max_rounds:
        description: "Rodadas de auto-correcao (stubs de headers)"
        required: false
        default: "8"
      commit_back:
        description: "Commitar a pasta XboxWinClient no repo"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  port-windows:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      CONTRIBS_REPO: ${{ inputs.contribs_repo }}
      CONTRIBS_SUBDIR: ${{ inputs.contribs_subdir }}
      CONTRIBS_REF: ${{ inputs.contribs_ref }}
      PROJECT_FILE: ${{ inputs.project_file }}
      TOOLSET_IN: ${{ inputs.toolset }}
      MAX_ROUNDS: ${{ inputs.max_rounds }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- Contribs via git (clone parcial) + Boost ----------
      - name: Prepare Contribs (git sparse clone)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $ws = (Get-Location).Path
          $dir = "D:\contribs_repo"
          $contrib = $null
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue

          if ($env:CONTRIBS_REPO) {
            for ($i = 1; $i -le 3 -and -not $contrib; $i++) {
              Write-Host "git clone parcial de $env:CONTRIBS_REPO (tentativa $i)..."
              $a = @("clone","--depth","1","--filter=blob:none","--sparse")
              if ($env:CONTRIBS_REF) { $a += @("--branch",$env:CONTRIBS_REF) }
              $a += @($env:CONTRIBS_REPO, $dir)
              git @a
              if ($LASTEXITCODE -eq 0) {
                git -C $dir sparse-checkout set $env:CONTRIBS_SUBDIR
                if ($LASTEXITCODE -eq 0 -and (Test-Path "$dir\$env:CONTRIBS_SUBDIR")) { $contrib = "$dir\$env:CONTRIBS_SUBDIR" }
              }
              if (-not $contrib) { Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5 }
            }
          }

          if ($contrib) {
            Write-Host "Contribs clonado em: $contrib"
            Write-Host "Subpastas do Contribs:"
            Get-ChildItem $contrib -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            $size = (Get-ChildItem $contrib -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host ("Tamanho: {0:N0} MB" -f ($size / 1MB))
          } else {
            Write-Host "::warning::Nao consegui clonar o Contribs, usando so a pasta boost do repo"
            $contrib = $ws
          }

          # procura boost\version.hpp: primeiro no Contribs, depois na pasta boost do repo
          $search = @($contrib)
          if (Test-Path "$ws\boost") { $search += "$ws\boost" }
          $boostRoot = $null
          foreach ($s in $search) {
            $ver = Get-ChildItem -Path $s -Filter "version.hpp" -Recurse -Depth 6 -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\boost\\version\.hpp$' } | Select-Object -First 1
            if ($ver) { $boostRoot = Split-Path (Split-Path $ver.FullName); Get-Content $ver.FullName | Select-String 'define BOOST_LIB_VERSION' | ForEach-Object { Write-Host $_.Line }; break }
          }
          if (-not $boostRoot) { Write-Error "boost\version.hpp nao encontrado (nem no Contribs, nem na pasta boost)"; exit 1 }

          Write-Host "CONTRIB_PATH=$contrib | BOOST_ROOT=$boostRoot"
          "CONTRIB_PATH=$contrib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BOOST_ROOT=$boostRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # um git que falhou numa tentativa (mas teve sucesso depois) nao pode derrubar o step
          $global:LASTEXITCODE = 0

      # ---------- Toolset (v140 se possivel: Boost antigo nao conhece MSVC novo) ----------
      - name: Install VS 2015 toolset (v140)
        if: ${{ inputs.toolset == 'auto' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsw -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "modify","--installPath","`"$vsPath`"",
            "--add","Microsoft.VisualStudio.Component.VC.140",
            "--quiet","--norestart","--noUpdateInstaller")
          Write-Host "Instalador saiu com codigo $($p.ExitCode)"
          $global:LASTEXITCODE = 0

      - name: Pick toolset
        shell: pwsh
        run: |
          $ts = $env:TOOLSET_IN
          if ($ts -eq "auto") {
            $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vsw -latest -products * -property installationPath
            $found = Get-ChildItem -Path "$vsPath\MSBuild\Microsoft\VC" -Recurse -Directory -Filter "v140" -ErrorAction SilentlyContinue | Select-Object -First 1
            $ts = if ($found) { "v140" } else { "v143" }
          }
          Write-Host "Toolset: $ts"
          "TOOLSET=$ts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- Criar XboxWinClient e converter ----------
      - name: Create XboxWinClient and patch Xbox -> Windows
        shell: pwsh
        run: |
          $ws  = (Get-Location).Path
          $dst = "$ws\XboxWinClient"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          # a pasta boost da raiz NAO e copiada (o Contribs ja fica fora do workspace em D:\)
          robocopy $ws $dst /E /XD "$ws\.git" "$ws\XboxWinClient" "$ws\boost" "$ws\logs" node_modules `
            /XF *.exe *.dll *.lib *.pdb *.obj *.zip /NFL /NDL /NJH /NJS /NP | Out-Null
          # robocopy usa codigos 0-7 para sucesso
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy falhou (codigo $LASTEXITCODE)"; exit 1 }
          $global:LASTEXITCODE = 0

          # --- header de compatibilidade (forcado com /FI) ---
          $shim = "$dst\_shims"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          @'
          #pragma once
          #ifndef XBOX_WIN_SHIM_H
          #define XBOX_WIN_SHIM_H
          #ifndef XBOX_WIN_PORT
          #define XBOX_WIN_PORT 1
          #endif
          #ifndef _WINSOCKAPI_
          #define _WINSOCKAPI_
          #endif
          #ifdef __cplusplus
          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif
          #include <windows.h>
          #include <d3d11_1.h>
          #include <dxgi1_2.h>
          typedef ID3D11Device1        ID3D11DeviceX;
          typedef ID3D11DeviceContext1 ID3D11DeviceContextX;
          #endif
          #ifndef PIXBeginEvent
          #define PIXBeginEvent(...)
          #define PIXEndEvent(...)
          #define PIXSetMarker(...)
          #endif
          #endif
          '@ | Set-Content "$shim\xbox_win_shim.h" -Encoding ascii

          $ts = $env:TOOLSET

          # --- projetos / props / sln ---
          $files = Get-ChildItem $dst -Recurse -Include *.vcxproj,*.props,*.targets,*.sln,*.filters -ErrorAction SilentlyContinue
          $n = 0
          foreach ($f in $files) {
            $t = [IO.File]::ReadAllText($f.FullName); $o = $t
            $t = [regex]::Replace($t, '<Import\b[^>]*Durango[^>]*/>\s*', '')
            $t = $t -replace '\$\(DurangoXDK\)[^;"<]*;?', ''
            $t = $t -replace 'Durango', 'x64'
            $t = $t -replace '<PlatformToolset>[^<]*</PlatformToolset>', "<PlatformToolset>$ts</PlatformToolset>"
            $t = $t -replace '(d3d11_x|d3d12_x|xg_x|xgi|xg|kernelx|pixEvt)\.lib;?', ''
            $t = $t -replace '(_XBOX_ONE|WINAPI_FAMILY=WINAPI_FAMILY_TV_TITLE|WINAPI_FAMILY=WINAPI_FAMILY_TV_APP|__WRL_NO_DEFAULT_LIB__);?', ''
            $t = $t -replace '<PreprocessorDefinitions>', '<PreprocessorDefinitions>XBOX_WIN_PORT;_WINSOCK_DEPRECATED_NO_WARNINGS;_CRT_SECURE_NO_WARNINGS;'
            if ($t -ne $o) { [IO.File]::WriteAllText($f.FullName, $t); $n++ }
          }
          Write-Host "Projetos/props alterados: $n"

          # --- codigo fonte ---
          # Latin1 preserva os bytes originais (evita corromper acentos em fontes sem BOM)
          $lat = [Text.Encoding]::GetEncoding(28591)
          $src = Get-ChildItem $dst -Recurse -Include *.cpp,*.c,*.cc,*.h,*.hpp,*.inl -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\_shims\\' }
          $m = 0
          foreach ($f in $src) {
            $t = [IO.File]::ReadAllText($f.FullName, $lat); $o = $t
            $t = $t -replace '(#\s*include\s*[<"])d3d11_x\.h([>"])',   '${1}d3d11_1.h${2}'
            $t = $t -replace '(#\s*include\s*[<"])d3d12_x\.h([>"])',   '${1}d3d12.h${2}'
            $t = $t -replace '(#\s*include\s*[<"])xaudio2_x\.h([>"])', '${1}xaudio2.h${2}'
            if ($t -ne $o) { [IO.File]::WriteAllText($f.FullName, $t, $lat); $m++ }
          }
          Write-Host "Fontes alterados: $m"

      # ---------- Compilar com auto-correcao ----------
      - name: Build XboxWinClient (auto-fix loop)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $ws  = (Get-Location).Path
          $dst = "$ws\XboxWinClient"
          $shim = "$dst\_shims"
          New-Item -ItemType Directory -Force -Path "$ws\logs" | Out-Null

          $projFile = Get-ChildItem $dst -Recurse -Filter $env:PROJECT_FILE | Select-Object -First 1
          if (-not $projFile) {
            Write-Host "Projeto '$env:PROJECT_FILE' nao encontrado. Disponiveis:"
            Get-ChildItem $dst -Recurse -Filter *.vcxproj | Select-Object -First 40 -ExpandProperty FullName
            exit 1
          }
          Write-Host "Projeto: $($projFile.FullName)"

          $map = @{
            "d3d11_x.h"   = "#include <d3d11_1.h>"
            "d3d12_x.h"   = "#include <d3d12.h>"
            "xaudio2_x.h" = "#include <xaudio2.h>"
            "xdk.h"       = ""
            "xg.h"        = ""
            "pix.h"       = ""
          }

          # headers do boost que faltam no Contribs e podem ser substituidos por stubs minimos
          $boostStubs = @{
            "boost/preprocessor/debug/error.hpp" = "#include <boost/preprocessor/cat.hpp>`n#define BOOST_PP_ERROR(code) BOOST_PP_CAT(BOOST_PP_ERROR_, code)"
          }

          $root = $dst
          $nested = Get-ChildItem $dst -Directory | Where-Object { Test-Path (Join-Path $_.FullName "App") } | Select-Object -First 1
          if (-not (Test-Path (Join-Path $dst "App")) -and $nested) { $root = $nested.FullName }

          $inc = @($shim, $env:BOOST_ROOT, $env:CONTRIB_PATH, $ws, $root, "$root\App\include", "$root\ClientShared", "$root\Log\include", "$root\Rendering\G3D\include", "$root\Network\include") |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $env:INCLUDE = (($inc -join ";") + ";" + $env:INCLUDE)
          # /permissive removido: e o padrao e o cl do v140 nao reconhece a flag
          $env:CL  = (($inc | ForEach-Object { "/I`"$_`"" }) -join " ") + " /FI`"$shim\xbox_win_shim.h`" /DBOOST_USE_WINDOWS_H /D_WINSOCK_DEPRECATED_NO_WARNINGS /D_CRT_SECURE_NO_WARNINGS /FS"
          $env:_CL_ = "/WX- /w /Zc:strictStrings-"

          $sdkVer = "10.0.22621.0"
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $sdkRoot) {
            $l = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            if ($l) { $sdkVer = $l.Name }
          }

          $ok = $false
          $max = [int]$env:MAX_ROUNDS
          for ($round = 1; $round -le $max; $round++) {
            $log = "$ws\logs\round$round.log"
            Write-Host "===== Rodada $round/$max ====="
            & msbuild.exe $projFile.FullName `
              "/p:Configuration=Release" "/p:Platform=x64" `
              "/p:PlatformToolset=$env:TOOLSET" "/p:WindowsTargetPlatformVersion=$sdkVer" `
              "/p:CONTRIB_PATH=$env:CONTRIB_PATH" `
              "/p:PostBuildEventUseInBuild=false" "/p:PreBuildEventUseInBuild=false" `
              "/p:TreatWarningAsError=false" `
              /maxCpuCount:1 /nologo /v:minimal "/flp:LogFile=$log;Verbosity=minimal" | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Host "BUILD OK na rodada $round"; $ok = $true; break }

            $missing = Select-String -Path $log -Pattern "C1083: Cannot open include file: '([^']+)'" -AllMatches |
              ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value -replace '\\','/' } | Sort-Object -Unique
            $new = 0
            foreach ($mh in $missing) {
              if ($mh -match '^boost/' -and -not $boostStubs.ContainsKey($mh)) { Write-Host "  (boost nao achado: $mh - verifique o Contribs/boost)"; continue }
              # nunca criar stub fora da pasta _shims
              if ($mh -match '(^|/)\.\.(/|$)' -or [IO.Path]::IsPathRooted($mh)) { Write-Host "  (ignorado: $mh)"; continue }
              $stub = Join-Path $shim ($mh -replace '/','\')
              if (Test-Path $stub) { continue }
              New-Item -ItemType Directory -Force -Path (Split-Path $stub) | Out-Null
              $leaf = Split-Path $mh -Leaf
              $body = "#pragma once"
              if ($boostStubs.ContainsKey($mh)) { $body += "`n" + $boostStubs[$mh] }
              elseif ($map.ContainsKey($leaf)) { $body += "`n" + $map[$leaf] }
              Set-Content -Path $stub -Value $body -Encoding ascii
              Write-Host "  stub criado: $mh"
              $new++
            }
            if ($new -eq 0) { Write-Host "Nenhum header novo para criar; parando o loop."; break }
          }

          # relatorio
          $last = Get-ChildItem "$ws\logs" -Filter "round*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $rep = "$ws\logs\port-report.txt"
          "Resultado: " + $(if ($ok) { "COMPILOU" } else { "FALHOU" }) | Set-Content $rep
          if ($last) {
            "`nTop erros ($($last.Name)):" | Add-Content $rep
            Select-String -Path $last.FullName -Pattern 'error (C|LNK|MSB)\d+' |
              ForEach-Object { if ($_.Line -match '(error (?:C|LNK|MSB)\d+: [^\[]{0,160})') { $Matches[1] } } |
              Group-Object | Sort-Object Count -Descending | Select-Object -First 50 |
              ForEach-Object { "{0,5}  {1}" -f $_.Count, $_.Name } | Add-Content $rep
            Write-Host "`n===== RELATORIO ====="; Get-Content $rep
          }
          if (-not $ok) { exit 1 }

      # ---------- Artefatos ----------
      - name: Upload XboxWinClient (codigo convertido)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XboxWinClient-src
          path: XboxWinClient/**
          if-no-files-found: ignore

      - name: Upload logs e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xboxwin-logs
          path: logs/**
          if-no-files-found: ignore

      - name: Upload binarios
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XboxWinClient-bin
          path: |
            XboxWinClient/**/*.exe
            XboxWinClient/**/*.dll
          if-no-files-found: warn

      # ---------- Opcional: commitar a pasta no repo ----------
      - name: Commit XboxWinClient
        if: ${{ always() && inputs.commit_back }}
        shell: pwsh
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          # nao commitar saidas de compilacao
          $ex = "obj","pdb","lib","exe","dll","ilk","idb","ipch","tlog","iobj","ipdb","pch","exp" |
            ForEach-Object { ":(exclude,glob)**/*.$_" }
          git add -f -- XboxWinClient @ex
          git commit -m "XboxWinClient: port experimental Xbox -> Windows"
          if ($LASTEXITCODE -ne 0) { Write-Host "Nada para commitar."; $global:LASTEXITCODE = 0; exit 0 }
          git push
